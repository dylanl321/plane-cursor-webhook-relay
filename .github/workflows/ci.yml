name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --extra dev
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run mypy
      - run: docker build -t plane-cursor-webhook-relay:test .
