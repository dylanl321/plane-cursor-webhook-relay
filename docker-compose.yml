services:
  relay:
    build:
      context: .
    image: plane-cursor-webhook-relay:local
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/relay.db
      PORT: 8787
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8787}:8787"
    volumes:
      - relay-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  relay-data:
